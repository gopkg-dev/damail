# 生产部署：一键安装 curl -fsSL https://damail.app/install.sh | sh
# 或手动：准备好 .env（至少 MASTER_KEY）后 docker compose pull && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: damail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-damail}
      POSTGRES_DB: damail
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damail"]
      interval: 5s
      retries: 10

  app:
    # GitHub Actions 发布的镜像：安装和升级都是 docker compose pull && docker compose up -d；
    # 固定版本在 .env 里写 DAMAIL_VERSION=v0.2.0。
    # 用源码自己构建：docker build -t ghcr.io/gopkg-dev/damail:dev . 然后在 .env 里写 DAMAIL_VERSION=dev
    image: ghcr.io/gopkg-dev/damail:${DAMAIL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://damail:${POSTGRES_PASSWORD:-damail}@db:5432/damail
      # 必填：openssl rand -hex 32 生成；丢失后已保存的邮箱授权码无法解密
      MASTER_KEY: ${MASTER_KEY:?请在 .env 中设置 MASTER_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-300}
      # 检查新版本（读 GitHub Release），内网部署设为 false
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # 以下可选，留空时使用默认值，说明见 https://damail.app/zh/docs/configuration/
      MAX_MESSAGE_MB: ${MAX_MESSAGE_MB:-}
      SEND_DELAY_SEC: ${SEND_DELAY_SEC:-}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-}
      UPDATE_REPO: ${UPDATE_REPO:-}
      UPDATE_CHECK_PROXY_ID: ${UPDATE_CHECK_PROXY_ID:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-}
      MCP_OAUTH_ACCESS_TOKEN_TTL_SEC: ${MCP_OAUTH_ACCESS_TOKEN_TTL_SEC:-}
      MCP_OAUTH_REFRESH_TOKEN_TTL_SEC: ${MCP_OAUTH_REFRESH_TOKEN_TTL_SEC:-}
      MCP_OAUTH_RATE_LIMIT_PER_MIN: ${MCP_OAUTH_RATE_LIMIT_PER_MIN:-}
    ports:
      # 默认只监听本机（给反向代理用）；直接对外提供服务时在 .env 里写 DAMAIL_BIND=0.0.0.0
      - "${DAMAIL_BIND:-127.0.0.1}:${DAMAIL_PORT:-8787}:8787"
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
